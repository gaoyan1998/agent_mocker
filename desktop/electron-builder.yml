appId: com.agentmocker.app
productName: Agent Mocker
copyright: Copyright © 2026 Agent Mocker Contributors

directories:
  output: release
  buildResources: build

# dist/ 里已经是 esbuild 打好的产物；node_modules 只剩 better-sqlite3 这一个
# 生产依赖（其余 JS 依赖都被 bundle 进去了），electron-builder 会自动带上。
files:
  - dist/**/*
  - package.json
  # better-sqlite3 加载的是 prebuilds/ 里的 N-API 预编译产物，
  # 供 node-gyp 现场编译用的 C++ 源码（约 25MB）不需要进安装包。
  # node_modules 由单独的收集器处理，排除规则要写成 **/node_modules/… 的形式才生效。
  - '!**/node_modules/better-sqlite3/deps/**'
  - '!**/node_modules/better-sqlite3/src/**'

# 原生模块和被 @fastify/static 读取的静态目录都不能待在 asar 里：
# .node 无法从 asar 内 dlopen，而 @fastify/static 会对 root 做 realpath 校验。
asarUnpack:
  - dist/web/**/*
  - node_modules/better-sqlite3/**/*

# 让 electron-builder 用 Electron 的 ABI 重新编译 better-sqlite3。
npmRebuild: true
buildDependenciesFromSource: false

artifactName: agent-mocker-${version}-${os}-${arch}.${ext}

linux:
  category: Development
  synopsis: Controllable AI runtime mock server for Agent development
  # 不显式指定的话会取 package.json 的 name，生成 "@agent-mockdesktop" 这种可执行文件名。
  executableName: agent-mocker
  desktop:
    entry:
      Name: Agent Mocker
      Comment: 可控的 AI Runtime Mock Server
      Categories: Development;Utility;
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agent Mocker

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 没有 Apple 开发者证书时保持 ad-hoc 签名，产物仍可运行（首次打开需右键“打开”）。
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  title: Agent Mocker ${version}
